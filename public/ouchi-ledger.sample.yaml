  title: あなたのおうち環境
networks:
  - name: インターネット
    cidr: 192.0.2.0/24
    accent: "#7467a8"
    note: RFC 5737 TEST-NET-1。WAN と外部サービス用
  - name: 家族用LAN
    cidr: 198.51.100.0/24
    accent: "#5b9bd6"
    note: RFC 5737 TEST-NET-2。自宅端末用
  - name: ホームラボ
    cidr: 203.0.113.0/24
    accent: "#4ba755"
    note: RFC 5737 TEST-NET-3。仮想化基盤とサーバー用
  - name: 個人ネットワーク
    cidr: 198.18.0.0/24
    accent: "#d69132"
    note: RFC 2544 ベンチマーク用。個人向け端末と検証用ホストの架空ネットワーク
