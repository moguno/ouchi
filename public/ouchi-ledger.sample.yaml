format: ouchi-ledger/17
exportedAt: "2026-11-21T09:00:00.000Z"
settings:
  domain: ouchi.example
  title: あなたのおうち環境
  color: '#c0a359'
  properties:
    運用方針: 架空のサンプル台帳。実在の機器・アドレスは含まれない
    バックアップ: 週1回、台帳YAMLをエクスポートして保管
project: デフォルト
networks:
  - name: 家族用LAN
    cidr: 198.51.100.0/24
    accent: "#5b9bd6"
    note: RFC 5737 TEST-NET-2。自宅端末用
  - name: ホームラボ
    cidr: 203.0.113.0/24
    accent: "#4ba755"
    note: RFC 5737 TEST-NET-3。仮想化基盤とサーバー用
    properties:
      方針: 検証はステージングで先に試してから本番へ
  - name: 個人ネットワーク
    cidr: 198.18.0.0/24
    accent: "#d69132"
    note: RFC 2544 ベンチマーク用。個人向け端末と検証用ホストの架空ネットワーク
  - name: データ基盤
    cidr: 198.18.1.0/24
    accent: "#b0483e"
    note: RFC 2544 ベンチマーク用範囲。DB専用の架空ネットワーク（アプリ基盤からL3スイッチ経由で到達）
  - name: アプリ基盤
    cidr: 198.18.2.0/24
    accent: "#00838f"
    note: RFC 2544 ベンチマーク用範囲。アプリケーションサーバー用の架空ネットワーク
  - name: インターネット
    cidr: 192.0.2.0/24
    accent: "#7467a8"
    note: RFC 5737 TEST-NET-1。WAN と外部サービス用
devices:
  - hostname: l3-switch
    petname: L3 Switch
    category: network
    sshUser: null
    sshPort: null
    meterEnabled: false
    note: 5つの内部ネットワークを接続する架空のL3スイッチ
    interfaces:
      - name: eth0
        network: 家族用LAN
        ip: 198.51.100.1
        properties:
          役割: 家族用LAN向けのゲートウェイ
          速度: 1Gbps
      - name: eth1
        network: ホームラボ
        ip: 203.0.113.1
      - name: eth2
        network: 個人ネットワーク
        ip: 198.18.0.1
      - name: eth3
        network: データ基盤
        ip: 198.18.1.1
      - name: eth4
        network: アプリ基盤
        ip: 198.18.2.1
