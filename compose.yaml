services:
  ouchi-portal:
    image: ghcr.io/moguno/ouchi:latest
    container_name: ouchi-portal
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ouchi-data:/app/data

  ouchi-mcp:
    image: ghcr.io/moguno/ouchi:latest
    container_name: ouchi-mcp
    restart: unless-stopped
    command: ["node", "mcp-dist/index.js"]
    ports:
      - "3333:3333"
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 3333
      OUCHI_REST_URL: http://ouchi-portal:3000
    depends_on:
      - ouchi-portal

volumes:
  ouchi-data:
